name: Sync files to iotcontroler

on:
  push:
    branches:
      - master
    paths:
      - "fritz_handler.py"
      - "Check_Types.md"
      - "check_types.py"

  # Allows manual execution from the GitHub Actions UI
  workflow_dispatch:

jobs:
  sync-fritz:
    runs-on: ubuntu-latest

    steps:
      # Checkout the frontend repository
      - name: Checkout iotfrontend
        uses: actions/checkout@v4
        with:
          path: iotfrontend

      # Checkout the controler repository
      - name: Checkout controler
        uses: actions/checkout@v4
        with:
          repository: s-muenzel/iotcontroler
          token: ${{ secrets.IOTCONTROLER_PAT }}
          path: iotcontroler

      # Copy files managed by this workflow
      - name: Copy files
        run: |
          cp iotfrontend/fritz_handler.py iotcontroler/fritz_handler.py
          cp iotfrontend/Check_Types.md iotcontroler/Check_Types.md
          cp iotfrontend/check_types.py iotcontroler/check_types.py

      # Commit and push only if the file actually changed
      - name: Commit and push changes
        working-directory: iotcontroler
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fritz_handler.py Check_Types.md check_types.py

          if git diff --cached --quiet; then
            echo "No changes detected in synced files"
            exit 0
          fi

          git commit -m "Sync files from frontend"
          git push
